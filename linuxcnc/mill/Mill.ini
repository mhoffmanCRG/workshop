# Mill (Mesa 5I25 + 7I76), originally generated by PNCconf (LinuxCNC 2.7) on 2020-05-17.
# Converted by hand to LinuxCNC 2.10 format (joints/axes split) on 2026-11-24.
# The original 2.7 file is kept in 2.7-original/Mill.ini.

[EMC]
VERSION = 1.1
MACHINE = Mill
DEBUG = 0

[DISPLAY]
DISPLAY = axis
PYVCP = custompanel.xml
EMBED_TAB_NAME = Probe Screen
EMBED_TAB_COMMAND = halcmd loadusr -Wn gladevcp gladevcp -c gladevcp -x {XID} -u python/probe_screen.py -H probe_icons/probe_screen.hal probe_icons/probe_screen.glade
EMBED_TAB_NAME = Tools
EMBED_TAB_COMMAND = python3 python/web_tab.py {XID} http://localhost/workshop
POSITION_OFFSET = RELATIVE
POSITION_FEEDBACK = ACTUAL
MAX_FEED_OVERRIDE = 2.000000
MAX_SPINDLE_OVERRIDE = 2.000000
MIN_SPINDLE_OVERRIDE = 0.00000
MAX_RAPID_OVERRIDE = 5.000000
INTRO_GRAPHIC = linuxcnc.gif
INTRO_TIME = 5
# Was /NC/Mill on the 2.7 PC (that folder did not exist there either). The /NC backup is restored to ~/NC.
PROGRAM_PREFIX = /home/hoffmam/NC
INCREMENTS = 100mm 50mm 25mm 10mm 5mm 1mm .5mm .1mm .05mm .01mm .005mm
DEFAULT_LINEAR_VELOCITY = 60.000000
MAX_LINEAR_VELOCITY = 110.000000
MIN_LINEAR_VELOCITY = 0.500000
DEFAULT_ANGULAR_VELOCITY = 60.000000
MAX_ANGULAR_VELOCITY = 360.000000
MIN_ANGULAR_VELOCITY = 1.666667
EDITOR = gnome-text-editor
GEOMETRY = xyz
#GEOMETRY = xy-az

[FILTER]
PROGRAM_EXTENSION = .png,.gif,.jpg Greyscale Depth Image
PROGRAM_EXTENSION = .py Python Script
png = image-to-gcode
gif = image-to-gcode
jpg = image-to-gcode
py = python3

[TASK]
TASK = milltask
CYCLE_TIME = 0.010

[RS274NGC]
PARAMETER_FILE = linuxcnc.var
FEATURES = 30
SUBROUTINE_PATH = macros
REMAP = M6   modalgroup=6  prolog=change_prolog   ngc=manual_change  epilog=change_epilog
#REMAP = G43  modalgroup=1 ngc=g43noToolTable argspec=z
RS274NGC_STARTUP_CODE = #<_ztouchoffdiff>=0 G59.1

[PYTHON]
PATH_PREPEND = ./python
TOPLEVEL = python/toplevel.py

[EMCMOT]
EMCMOT = motmod
COMM_TIMEOUT = 1.0
SERVO_PERIOD = 1000000

[HOSTMOT2]
# **** This is for info only ****
# DRIVER0=hm2_pci
# BOARD0=5i25

[HAL]
HALUI = halui
HALFILE = Mill.hal
#HALFILE = spindle.hal
HALFILE = custom.hal
POSTGUI_HALFILE = postgui_call_list.hal
SHUTDOWN = shutdown.hal

[HALUI]
MDI_COMMAND = o100 call
MDI_COMMAND = o101 call
MDI_COMMAND = o102 call
MDI_COMMAND = o103 call
MDI_COMMAND = o104 call
MDI_COMMAND = o105 call
MDI_COMMAND = o106 call
MDI_COMMAND = o107 call
MDI_COMMAND = o108 call
MDI_COMMAND = o109 call
MDI_COMMAND = o110 call
MDI_COMMAND = o111 call

[KINS]
KINEMATICS = trivkins coordinates=XYZA
JOINTS = 4

[TRAJ]
COORDINATES = X Y Z A
LINEAR_UNITS = mm
ANGULAR_UNITS = degree
DEFAULT_LINEAR_VELOCITY = 2.50
MAX_LINEAR_VELOCITY = 60.00
DEFAULT_ANGULAR_VELOCITY = 36.00
MAX_ANGULAR_VELOCITY = 360.00

[EMCIO]
TOOL_TABLE = tool.tbl
TOOL_CHANGE_QUILL_UP = 1
#TOOL_CHANGE_POSITION = 0 265 0

#********************
# Axis X  (joint 0)
#********************
[AXIS_X]
MIN_LIMIT = -600
MAX_LIMIT = 5.0
MAX_VELOCITY = 120.0
MAX_ACCELERATION = 750.0

[JOINT_0]
TYPE = LINEAR
HOME = 0.0
FERROR = 10.0
MIN_FERROR = 1.0
